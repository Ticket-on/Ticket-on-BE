global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-server:8080']

  - job_name: kafka
    scrape_interval: 5s
    static_configs:
      - targets: ['kafka-exporter:9308']
