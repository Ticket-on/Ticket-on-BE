apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 2s

  - name: MySQL
    type: mysql
    uid: mysql
    url: mysql:3306
    user: root
    jsonData:
      database: $DB_NAME
    secureJsonData:
      password: $DB_PASSWORD
