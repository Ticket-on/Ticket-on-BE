spring:
  profiles:
    active: docker
  config:
    import: "optional:file:.env[.properties]"

  jpa:
    hibernate:
      ddl-auto: create
      database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
        format_sql: false


logging:
  level:
    root: ERROR
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO


#snail-catch:
#  enabled: false
#  repository-pointcut: execution(* com.ticketon.ticketon.domain..repository..*(..))
#  api-key: 13a4d744b37046e2b62f90077c0936f8



toss:
  secret-key: ${TOSS_SECRET_KEY}
  client-key: ${TOSS_CLIENT_KEY}
  base-url: https://api.tosspayments.com/v1/payments
  confirm-end-point: /confirm
  cancel-end-point: /cancel

resilience4j:
  circuitbreaker:
    instances:
      toss-confirm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.ticketon.ticketon.payment.implement.gateway.PgUnavailablePredicate
